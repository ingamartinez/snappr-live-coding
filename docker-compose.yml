services:
  db:
    image: postgres:16-alpine
    container_name: snappr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: snappr
      POSTGRES_PASSWORD: snappr
      POSTGRES_DB: snappr
    ports:
      # Host 5433 -> container 5432, to avoid clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - snappr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snappr -d snappr"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  snappr_pgdata:
